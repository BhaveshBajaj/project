<div class="admin-profile-container">
  <!-- Admin Header -->
  <header class="admin-header">
    <div class="header-left">
      <button class="home-btn" (click)="goToDashboard()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2"/>
          <polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <h1 class="admin-title">ADMIN</h1>
    </div>
    
    <div class="header-middle">
      <div class="nav-bar">
        <div class="search-container">
          <input 
            type="text" 
            class="search-input" 
            placeholder="Q Search Courses"
          />
        </div>
      </div>
    </div>
    
    <div class="header-right">
      <button class="clear-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <button class="notification-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      
      <div class="admin-avatar" (click)="logout()">
        <img [src]="currentUser?.avatarUrl || 'assets/default-avatar.png'" [alt]="currentUser?.fullName" />
      </div>
    </div>
  </header>

  <!-- Breadcrumbs -->
  <nav class="breadcrumbs">
    <span class="breadcrumb-item">Home</span>
    <span class="breadcrumb-separator">></span>
    <span class="breadcrumb-item active">Admin Console</span>
  </nav>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Admin Console -->
    <section class="admin-console">
      <h2 class="console-title">Admin Console</h2>
      <div class="console-grid">
        <div 
          class="console-card" 
          (click)="onActionClick(userManagementAction)"
        >
          <div class="card-icon">👥</div>
          <div class="card-content">
            <h3 class="card-title">User Management 1234</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Floating Action Bar -->
  <div class="floating-action-bar">
    <div class="action-tools">
      <button class="tool-btn" title="Cursor">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <button class="tool-btn" title="Hand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0" stroke="currentColor" stroke-width="2"/>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2" stroke="currentColor" stroke-width="2"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8" stroke="currentColor" stroke-width="2"/>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <button class="tool-btn" title="Circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <button class="start-editing-btn">
        Start editi
      </button>
    </div>
  </div>
</div>
