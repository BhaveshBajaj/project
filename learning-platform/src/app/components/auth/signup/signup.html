<div class="auth-container">
  <!-- Left Side - SVG Illustration -->
  <div class="auth-left">
    <div class="illustration-container">
      <img 
        src="assets/KWA-1.jpg" 
        alt="Learning Platform Illustration" 
        class="auth-illustration"
        loading="lazy"
        (error)="onImageError($event)"
      />
      <div class="illustration-fallback" *ngIf="imageLoadError">
        <div class="fallback-content">
          <div class="brand-badge">
            <h3>Learning Platform</h3>
            <p>Build, Schedule, Learn!</p>
          </div>
          <div class="fallback-icons">
            <div class="icon">📚</div>
            <div class="icon">💻</div>
            <div class="icon">🎯</div>
            <div class="icon">🚀</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Signup Form -->
  <div class="auth-right">
    <div class="form-container">
      <div class="form-header">
        <h2 class="product-name">Learning Platform</h2>
        <h1 class="welcome-title">Sign up</h1>
        <p class="form-subtitle">Create your account to start learning</p>
        <div class="demo-info">
          <p><small>💡 <strong>Demo:</strong> Try any username and email, password must be 6+ characters</small></p>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="auth-form">
        <div class="input-group">
          <input
            type="text"
            name="username"
            [(ngModel)]="signupData.username"
            required
            class="form-input"
            placeholder="Enter your username"
            minlength="3"
          />
          <label class="floating-label">Username</label>
        </div>

        <div class="input-group">
          <input
            type="email"
            name="email"
            [(ngModel)]="signupData.email"
            required
            class="form-input"
            placeholder="Enter your email"
          />
          <label class="floating-label">Email</label>
        </div>

        <div class="input-group">
          <input
            type="password"
            name="password"
            [(ngModel)]="signupData.password"
            required
            class="form-input"
            placeholder="Enter your password"
            minlength="6"
          />
          <label class="floating-label">Password</label>
        </div>

        <div class="input-group" *ngIf="signupData.password">
          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="signupData.confirmPassword"
            required
            class="form-input"
            placeholder="Confirm your password"
          />
          <label class="floating-label">Confirm Password</label>
        </div>

        <div class="password-strength" *ngIf="signupData.password">
          <div class="strength-bar">
            <div class="strength-fill" [class]="getPasswordStrengthClass()"></div>
          </div>
          <p class="strength-text">{{ getPasswordStrengthText() }}</p>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input
              type="checkbox"
              name="agreeToTerms"
              [(ngModel)]="signupData.agreeToTerms"
              required
            />
            <span class="checkmark"></span>
            I agree to the <a href="#" class="terms-link">terms and conditions</a>
          </label>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="isLoading || !signupForm.valid || !passwordsMatch()"
        >
          <span *ngIf="isLoading" class="loading-content">
            <span class="loading-spinner"></span>
            Creating Account...
          </span>
          <span *ngIf="!isLoading">CREATE ACCOUNT</span>
        </button>

        <div class="form-footer">
          <p>Already have an account? <a (click)="goToLogin()" class="login-link">Sign in</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
