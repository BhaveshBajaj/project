<div class="auth-container">
  <!-- Left Side - Illustration -->
  <div class="auth-left">
    <div class="illustration-container">
      <div class="brand-text">Build, Schedule!</div>
      
      <!-- Main Illustration -->
      <div class="main-illustration">
        <!-- Computer/Monitor -->
        <div class="computer">
          <div class="screen">
            <div class="video-player">
              <div class="play-button">▶</div>
              <div class="progress-bar"></div>
            </div>
          </div>
          <div class="monitor-stand"></div>
        </div>
        
        <!-- Person working -->
        <div class="person">
          <div class="person-body"></div>
          <div class="person-head"></div>
          <div class="laptop"></div>
        </div>
        
        <!-- UI Elements -->
        <div class="ui-elements">
          <div class="chat-bubble"></div>
          <div class="search-icon">🔍</div>
          <div class="settings-icon">⚙</div>
          <div class="presentation-icon">📊</div>
          <div class="lightbulb">💡</div>
        </div>
        
        <!-- Books and objects -->
        <div class="objects">
          <div class="books"></div>
          <div class="coffee-cup"></div>
          <div class="plant"></div>
          <div class="chair"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div class="auth-right">
    <div class="form-container">
      <div class="form-header">
        <h2 class="product-name">Product Name</h2>
        <h1 class="welcome-title">Welcome!</h1>
        <p class="form-subtitle">Sign in to your Learning account</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
        <div class="input-group">
          <input
            type="email"
            name="email"
            [(ngModel)]="loginData.email"
            required
            class="form-input"
            placeholder="nathan.william@deloitte.com"
          />
          <label class="floating-label">Email</label>
        </div>

        <div class="input-group">
          <input
            type="password"
            name="password"
            [(ngModel)]="loginData.password"
            required
            class="form-input"
            placeholder="••••••••••••"
          />
          <label class="floating-label">Password</label>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="loginData.rememberMe"
            />
            <span class="checkmark"></span>
            Remember Me
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="isLoading || !loginForm.valid"
        >
          <span *ngIf="isLoading">Signing in...</span>
          <span *ngIf="!isLoading">SIGN IN</span>
        </button>

        <div class="form-footer">
          <p>Don't have account yet? <a (click)="goToSignup()" class="signup-link">Register now</a></p>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.auth-container {
  min-height: 100vh;
  display: flex;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Left Side - Illustration */
.auth-left {
  flex: 1;
  background: linear-gradient(135deg, #20B2AA 0%, #2E8B57 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.brand-text {
  position: absolute;
  top: 30px;
  left: 30px;
  background: #FF69B4;
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 14px;
}

.illustration-container {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 400px;
}

/* Computer/Monitor */
.computer {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}

.screen {
  width: 220px;
  height: 140px;
  background: #2C3E50;
  border-radius: 8px;
  border: 8px solid #34495E;
  position: relative;
  overflow: hidden;
}

.video-player {
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, #3498DB, #2980B9);
  position: relative;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 24px;
  background: rgba(0,0,0,0.3);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.progress-bar {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  height: 4px;
  background: rgba(255,255,255,0.3);
  border-radius: 2px;
}

.progress-bar::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 60%;
  height: 100%;
  background: #E74C3C;
  border-radius: 2px;
}

.monitor-stand {
  width: 60px;
  height: 20px;
  background: #34495E;
  margin: 0 auto;
  border-radius: 0 0 8px 8px;
}

/* Person */
.person {
  position: absolute;
  bottom: 80px;
  left: 80px;
  z-index: 2;
}

.person-body {
  width: 40px;
  height: 60px;
  background: #2C3E50;
  border-radius: 20px 20px 8px 8px;
}

.person-head {
  width: 25px;
  height: 25px;
  background: #F4D1AE;
  border-radius: 50%;
  margin: -5px auto 0;
}

.laptop {
  width: 35px;
  height: 20px;
  background: #34495E;
  border-radius: 4px;
  margin-top: 10px;
  position: relative;
}

.laptop::after {
  content: '';
  position: absolute;
  top: -12px;
  left: 2px;
  width: 31px;
  height: 15px;
  background: #2C3E50;
  border-radius: 2px 2px 0 0;
}

/* UI Elements */
.ui-elements {
  position: absolute;
  inset: 0;
}

.chat-bubble {
  position: absolute;
  top: 80px;
  right: 60px;
  width: 60px;
  height: 35px;
  background: #3498DB;
  border-radius: 15px;
  z-index: 4;
}

.chat-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 15px;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid #3498DB;
}

.search-icon, .settings-icon, .presentation-icon, .lightbulb {
  position: absolute;
  font-size: 20px;
  z-index: 4;
}

.search-icon {
  top: 40px;
  right: 150px;
}

.settings-icon {
  top: 60px;
  left: 40px;
  font-size: 24px;
}

.presentation-icon {
  top: 40px;
  right: 100px;
}

.lightbulb {
  bottom: 120px;
  right: 80px;
}

/* Objects */
.objects {
  position: absolute;
  inset: 0;
}

.books {
  position: absolute;
  bottom: 60px;
  left: 40px;
  width: 30px;
  height: 40px;
  background: linear-gradient(45deg, #E74C3C, #C0392B);
  border-radius: 4px;
  z-index: 1;
}

.books::after {
  content: '';
  position: absolute;
  left: 5px;
  top: -5px;
  width: 25px;
  height: 35px;
  background: #F39C12;
  border-radius: 4px;
}

.coffee-cup {
  position: absolute;
  bottom: 100px;
  right: 120px;
  width: 20px;
  height: 25px;
  background: #8B4513;
  border-radius: 0 0 10px 10px;
  z-index: 1;
}

.coffee-cup::after {
  content: '';
  position: absolute;
  top: 5px;
  left: -8px;
  width: 12px;
  height: 8px;
  border: 2px solid #8B4513;
  border-left: none;
  border-radius: 0 8px 8px 0;
}

.plant {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 25px;
  height: 35px;
  background: #27AE60;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  z-index: 1;
}

.chair {
  position: absolute;
  bottom: 40px;
  right: 180px;
  width: 35px;
  height: 45px;
  background: #F39C12;
  border-radius: 8px 8px 0 0;
  z-index: 1;
}

/* Right Side - Form */
.auth-right {
  flex: 1;
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
}

.form-container {
  width: 100%;
  max-width: 400px;
}

.form-header {
  margin-bottom: 40px;
  text-align: left;
}

.product-name {
  color: #8E8E93;
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.welcome-title {
  color: white;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
}

.form-subtitle {
  color: #8E8E93;
  font-size: 16px;
  font-weight: 400;
}

.auth-form {
  width: 100%;
}

.input-group {
  position: relative;
  margin-bottom: 24px;
}

.form-input {
  width: 100%;
  padding: 16px 12px 12px 12px;
  background: transparent;
  border: 1px solid #3A3A3C;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  transition: all 0.3s ease;
}

.form-input:focus {
  outline: none;
  border-color: #007AFF;
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.form-input::placeholder {
  color: #8E8E93;
  opacity: 0.8;
}

.floating-label {
  position: absolute;
  top: -8px;
  left: 12px;
  background: #1a1a2e;
  color: #8E8E93;
  font-size: 12px;
  padding: 0 4px;
  font-weight: 500;
}

.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.remember-me {
  display: flex;
  align-items: center;
  color: #8E8E93;
  font-size: 14px;
  cursor: pointer;
}

.remember-me input[type="checkbox"] {
  display: none;
}

.checkmark {
  width: 16px;
  height: 16px;
  border: 1px solid #3A3A3C;
  border-radius: 3px;
  margin-right: 8px;
  position: relative;
  transition: all 0.3s ease;
}

.remember-me input[type="checkbox"]:checked + .checkmark {
  background: #007AFF;
  border-color: #007AFF;
}

.remember-me input[type="checkbox"]:checked + .checkmark::after {
  content: '✓';
  position: absolute;
  top: -2px;
  left: 2px;
  color: white;
  font-size: 12px;
}

.forgot-password {
  color: #007AFF;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}

.forgot-password:hover {
  text-decoration: underline;
}

.submit-btn {
  width: 100%;
  padding: 16px;
  background: #007AFF;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.submit-btn:hover:not(:disabled) {
  background: #0056CC;
  transform: translateY(-1px);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.error-message {
  background: rgba(255, 59, 48, 0.1);
  color: #FF3B30;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  border: 1px solid rgba(255, 59, 48, 0.2);
}

.form-footer {
  text-align: center;
  margin-top: 32px;
}

.form-footer p {
  color: #8E8E93;
  font-size: 14px;
}

.signup-link {
  color: #007AFF;
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.signup-link:hover {
  text-decoration: underline;
}

/* Responsive Design */
@media (max-width: 768px) {
  .auth-container {
    flex-direction: column;
  }
  
  .auth-left {
    min-height: 40vh;
  }
  
  .auth-right {
    min-height: 60vh;
    padding: 20px;
  }
  
  .illustration-container {
    transform: scale(0.7);
  }
  
  .welcome-title {
    font-size: 28px;
  }
}
</style>
