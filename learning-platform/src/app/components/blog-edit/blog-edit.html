<div class="blog-edit-page" *ngIf="!isLoading && blog">
  <!-- Header -->
  <header class="edit-header">
    <div class="header-content">
      <button class="back-btn" (click)="onBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Blogs
      </button>
      
      <div class="header-actions">
        <button class="save-draft-btn" (click)="onSaveDraft()" [disabled]="isSaving">
          Save Draft
        </button>
        <button class="publish-btn" (click)="onSave()" [disabled]="isSaving">
          <span *ngIf="!isSaving">Publish</span>
          <span *ngIf="isSaving">Publishing...</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="edit-main">
    <div class="edit-container">
      <!-- Blog Title -->
      <div class="title-section">
        <label class="section-label">Blog Title</label>
        <input 
          type="text" 
          class="title-input" 
          [(ngModel)]="editForm.title" 
          placeholder="The Rise of AI in Cybersecurity: Opportunities and Threats"
        />
      </div>

      <!-- Category -->
      <div class="category-section">
        <label class="section-label">Category</label>
        <select class="category-select" [(ngModel)]="editForm.category">
          <option value="" disabled>Select category</option>
          <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
        </select>
      </div>

      <!-- Content Editor -->
      <div class="content-section">
        <label class="section-label">Blog Content</label>
        <div class="editor-toolbar">
          <div class="toolbar-group">
            <button class="toolbar-btn" title="Bold">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" stroke="currentColor" stroke-width="2"/>
                <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <button class="toolbar-btn" title="Italic">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <line x1="19" y1="4" x2="10" y2="4" stroke="currentColor" stroke-width="2"/>
                <line x1="14" y1="20" x2="5" y2="20" stroke="currentColor" stroke-width="2"/>
                <line x1="15" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <button class="toolbar-btn" title="Underline">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3" stroke="currentColor" stroke-width="2"/>
                <line x1="4" y1="21" x2="20" y2="21" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="Strikethrough">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M6 16h12M8 12h8M8 8h8" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="Bullet List">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <line x1="8" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                <line x1="8" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="8" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2"/>
                <line x1="3" y1="6" x2="3.01" y2="6" stroke="currentColor" stroke-width="2"/>
                <line x1="3" y1="12" x2="3.01" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="3" y1="18" x2="3.01" y2="18" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <button class="toolbar-btn" title="Numbered List">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <line x1="10" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                <line x1="10" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="10" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2"/>
                <path d="M4 6h1v4" stroke="currentColor" stroke-width="2"/>
                <path d="M4 10h2" stroke="currentColor" stroke-width="2"/>
                <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="Link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
            <button class="toolbar-btn" title="Image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>
        
        <textarea 
          class="content-editor" 
          [(ngModel)]="editForm.content" 
          placeholder="Write your blog content here...

Google Data Analytics is a powerful suite of tools and methodologies designed to help individuals and organizations make sense of vast amounts of data. At its core, Google Data Analytics encompasses various Google products and services like Google Analytics, BigQuery, and Google Data Studio, each serving as crucial components in the modern data ecosystem.

This comprehensive approach enables users to track website performance, monitor user behavior, and interpret business insights that drive business growth. The versatility and scalability of Google Analytics solutions make them suitable for both small startups and large enterprises.

One of the key strengths of Google Data Analytics lies in its user-friendly interface and integration capabilities. Google Analytics, for example, allows users to track website traffic, understand user journeys, identify high-performing content, and analyze conversion rates."
          rows="20"
        ></textarea>
      </div>

      <!-- Footer Message -->
      <div class="footer-message">
        <p>Drag and drop an image to upload to your blog!</p>
        <p>Choose file</p>
      </div>
    </div>
  </main>
</div>

<!-- Loading State -->
<div class="loading-state" *ngIf="isLoading">
  <div class="loading-spinner">
    <div class="spinner"></div>
  </div>
  <p>Loading blog editor...</p>
</div>
