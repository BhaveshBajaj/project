<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20B2AA"/>
      <stop offset="100%" style="stop-color:#2E8B57"/>
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB"/>
      <stop offset="100%" style="stop-color:#2980B9"/>
    </linearGradient>
    
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Main Computer/Monitor -->
  <g id="computer" transform="translate(190, 60)">
    <!-- Monitor Base -->
    <rect x="35" y="140" width="60" height="20" rx="8" fill="#34495E"/>
    
    <!-- Monitor Screen -->
    <rect x="0" y="0" width="130" height="85" rx="8" fill="#2C3E50" stroke="#34495E" stroke-width="6"/>
    
    <!-- Screen Content -->
    <rect x="8" y="8" width="114" height="69" rx="4" fill="url(#screenGradient)"/>
    
    <!-- Video Player UI -->
    <circle cx="65" cy="42" r="15" fill="rgba(0,0,0,0.3)"/>
    <polygon points="60,37 60,47 70,42" fill="white"/>
    
    <!-- Progress Bar -->
    <rect x="15" y="65" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="15" y="65" width="60" height="3" rx="1.5" fill="#E74C3C"/>
  </g>
  
  <!-- Person with Laptop -->
  <g id="person" transform="translate(80, 250)">
    <!-- Person Body -->
    <ellipse cx="20" cy="40" rx="18" ry="30" fill="#2C3E50"/>
    
    <!-- Person Head -->
    <circle cx="20" cy="12" r="12" fill="#F4D1AE"/>
    
    <!-- Hair -->
    <path d="M 8 8 Q 20 -2 32 8 Q 30 12 20 14 Q 10 12 8 8" fill="#8B4513"/>
    
    <!-- Laptop -->
    <g transform="translate(5, 55)">
      <rect x="0" y="0" width="30" height="15" rx="2" fill="#34495E"/>
      <rect x="2" y="2" width="26" height="11" rx="1" fill="#1E1E1E"/>
      <rect x="3" y="-8" width="24" height="10" rx="1" fill="#2C3E50"/>
    </g>
  </g>
  
  <!-- Books Stack -->
  <g id="books" transform="translate(40, 320)">
    <rect x="0" y="0" width="25" height="35" rx="3" fill="#E74C3C"/>
    <rect x="5" y="-5" width="20" height="30" rx="2" fill="#F39C12"/>
    <rect x="10" y="-10" width="18" height="25" rx="2" fill="#27AE60"/>
    
    <!-- Book Details -->
    <rect x="2" y="25" width="21" height="2" fill="#C0392B"/>
    <rect x="7" y="15" width="16" height="2" fill="#E67E22"/>
    <rect x="12" y="5" width="14" height="2" fill="#229954"/>
  </g>
  
  <!-- Coffee Cup -->
  <g id="coffee" transform="translate(380, 280)">
    <rect x="0" y="10" width="18" height="20" rx="9" fill="#8B4513"/>
    <ellipse cx="9" cy="10" rx="9" ry="3" fill="#D4A574"/>
    
    <!-- Handle -->
    <path d="M 18 15 Q 25 15 25 20 Q 25 25 18 25" stroke="#8B4513" stroke-width="2" fill="none"/>
    
    <!-- Steam -->
    <path d="M 6 5 Q 6 2 8 2 Q 8 5 6 5" stroke="#E0E0E0" stroke-width="1" fill="none"/>
    <path d="M 12 5 Q 12 2 14 2 Q 14 5 12 5" stroke="#E0E0E0" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Plant -->
  <g id="plant" transform="translate(420, 300)">
    <!-- Pot -->
    <path d="M 5 25 L 15 25 L 18 35 L 2 35 Z" fill="#8B4513"/>
    
    <!-- Leaves -->
    <ellipse cx="10" cy="15" rx="8" ry="12" fill="#27AE60"/>
    <ellipse cx="6" cy="10" rx="6" ry="8" fill="#2ECC71"/>
    <ellipse cx="14" cy="12" rx="5" ry="10" fill="#58D68D"/>
  </g>
  
  <!-- UI Elements -->
  <g id="ui-elements">
    <!-- Chat Bubble -->
    <g transform="translate(320, 80)">
      <rect x="0" y="0" width="50" height="25" rx="12" fill="#3498DB"/>
      <polygon points="12,25 12,32 20,25" fill="#3498DB"/>
      
      <!-- Chat Lines -->
      <rect x="8" y="6" width="30" height="2" rx="1" fill="white" opacity="0.8"/>
      <rect x="8" y="12" width="25" height="2" rx="1" fill="white" opacity="0.8"/>
      <rect x="8" y="18" width="20" height="2" rx="1" fill="white" opacity="0.8"/>
    </g>
    
    <!-- Search Icon -->
    <g transform="translate(300, 40)">
      <circle cx="8" cy="8" r="6" stroke="#007AFF" stroke-width="2" fill="none"/>
      <line x1="12" y1="12" x2="16" y2="16" stroke="#007AFF" stroke-width="2"/>
    </g>
    
    <!-- Settings Gear -->
    <g transform="translate(40, 60)">
      <circle cx="12" cy="12" r="8" fill="#95A5A6"/>
      <circle cx="12" cy="12" r="4" fill="#7F8C8D"/>
      <rect x="10" y="0" width="4" height="6" fill="#95A5A6"/>
      <rect x="10" y="18" width="4" height="6" fill="#95A5A6"/>
      <rect x="0" y="10" width="6" height="4" fill="#95A5A6"/>
      <rect x="18" y="10" width="6" height="4" fill="#95A5A6"/>
    </g>
    
    <!-- Lightbulb -->
    <g transform="translate(380, 120)">
      <ellipse cx="10" cy="8" rx="6" ry="8" fill="url(#lightGradient)"/>
      <rect x="7" y="14" width="6" height="4" rx="1" fill="#E67E22"/>
      <rect x="6" y="16" width="8" height="2" rx="1" fill="#D68910"/>
      
      <!-- Light rays -->
      <line x1="10" y1="-2" x2="10" y2="-8" stroke="#FFD700" stroke-width="2"/>
      <line x1="18" y1="2" x2="22" y2="-2" stroke="#FFD700" stroke-width="2"/>
      <line x1="18" y1="14" x2="22" y2="18" stroke="#FFD700" stroke-width="2"/>
      <line x1="2" y1="2" x2="-2" y2="-2" stroke="#FFD700" stroke-width="2"/>
      <line x1="2" y1="14" x2="-2" y2="18" stroke="#FFD700" stroke-width="2"/>
    </g>
    
    <!-- Presentation Chart -->
    <g transform="translate(350, 40)">
      <rect x="0" y="8" width="30" height="20" rx="2" fill="white" stroke="#34495E" stroke-width="1"/>
      <rect x="4" y="20" width="3" height="6" fill="#3498DB"/>
      <rect x="9" y="16" width="3" height="10" fill="#E74C3C"/>
      <rect x="14" y="18" width="3" height="8" fill="#F39C12"/>
      <rect x="19" y="14" width="3" height="12" fill="#27AE60"/>
    </g>
  </g>
  
  <!-- Floating Elements -->
  <g id="floating-elements">
    <!-- Code Brackets -->
    <g transform="translate(120, 100)" opacity="0.7">
      <text x="0" y="0" font-family="monospace" font-size="24" fill="#FF69B4" font-weight="bold">&lt;/&gt;</text>
    </g>
    
    <!-- WiFi Signal -->
    <g transform="translate(360, 180)" opacity="0.6">
      <path d="M 0 10 Q 5 5 10 10" stroke="#3498DB" stroke-width="2" fill="none"/>
      <path d="M -2 12 Q 5 3 12 12" stroke="#3498DB" stroke-width="2" fill="none"/>
      <path d="M -4 14 Q 5 1 14 14" stroke="#3498DB" stroke-width="2" fill="none"/>
      <circle cx="5" cy="12" r="1.5" fill="#3498DB"/>
    </g>
    
    <!-- Notification Bell -->
    <g transform="translate(100, 180)" opacity="0.6">
      <path d="M 5 0 Q 0 0 0 5 L 0 10 Q 0 12 2 12 L 8 12 Q 10 12 10 10 L 10 5 Q 10 0 5 0" fill="#F39C12"/>
      <rect x="3" y="12" width="4" height="2" rx="2" fill="#E67E22"/>
      <circle cx="8" cy="3" r="2" fill="#E74C3C"/>
    </g>
  </g>
  
  <!-- Brand Badge -->
  <g id="brand-badge" transform="translate(30, 30)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#FF69B4"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Build, Schedule!</text>
  </g>
</svg>
